services:
  nexo-assist:
    build: .
    env_file: .env
    ports:
      # Por padrão só localmente, com o Nginx/Cloudflare fazendo o HTTPS na frente.
      # Para expor direto: NEXO_BIND=0.0.0.0 (e COOKIE_SECURE=false se não houver HTTPS).
      - "${NEXO_BIND:-127.0.0.1}:${NEXO_PORT:-3000}:3000"
    volumes:
      - nexo-data:/app/data
    restart: unless-stopped

volumes:
  nexo-data:
